const cmap = (() => { const c = document.createElement('canvas'); c.width = 64; c.height = 256; const g = c.getContext('2d'); g.fillStyle = '#fff3d6'; g.fillRect(0, 0, 64, 256); g.fillStyle = '#e8102e'; for (let i = -2; i < 10; i++) { g.beginPath(); g.moveTo(0, i * 32 + 18); g.lineTo(64, i * 32 - 10); g.lineTo(64, i * 32 + 10); g.lineTo(0, i * 32 + 38); g.fill(); } const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1, 2); return t; })();

// ---------- さわる ----------
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); const hearts = [];
function poke(b, str = 1) { b.v += 7 * str; b.hv = 4.2 * str; sound(300 + (b.r < 0.7 ? 260 : 0) + rnd() * 90, Math.min(1.3, 0.7 + str * 0.4)); navigator.vibrate?.(10);
  for (let i = 0; i < 5; i++) hearts.push({ x: b.grp.position.x + rr(-0.4, 0.4), y: (b.grp.position.y || 0) + b.r * 1.6, z: b.grp.position.z + rr(-0.3, 0.3), t: -i * 0.08, c: rnd() < 0.5 ? '#ff6fa8' : '#ffd24d' }); }
function pick(e) { const r = cvs.getBoundingClientRect(); ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); ray.setFromCamera(ptr, cam); const hit = ray.intersectObjects(blobs.map((b) => b.body), false)[0]; return hit ? bodyToBlob.get(hit.object) : null; }
const holds = new Map();      // 指ごとの状態：ぷよをおしている／背景をなぞって視点を動かしている
cvs.addEventListener('pointerdown', (e) => {

  cvs.setPointerCapture(e.pointerId); document.getElementById('hint').style.opacity = 0;
  if (b) { b.held++; sound(190, 0.5); }
});
cvs.addEventListener('pointermove', (e) => { const h = holds.get(e.pointerId); if (!h || h.b) return; const dx = e.clientX - h.x, dy = e.clientY - h.y; if (Math.hypot(dx, dy) > 6) h.moved = true; if (h.moved) { tYaw = Math.max(-0.5, Math.min(0.5, h.yaw - dx * 0.004)); tPitch = Math.max(-0.1, Math.min(0.35, h.pitch + dy * 0.002)); } });

  if (h.b) { h.b.held--; poke(h.b, Math.min(1.5, 0.7 + (T - h.t) * 1.2)); }
  else if (!h.moved && e.type === 'pointerup') { const hs = blobs.filter((b) => !b.isTree); poke(hs[(Math.random() * hs.length) | 0], 0.6); } }
cvs.addEventListener('pointerup', release); cvs.addEventListener('pointercancel', release);
cvs.addEventListener('contextmenu', (e) => e.preventDefault());
const heartGeo = (() => { const s = new THREE.Shape(); s.moveTo(0, -0.5); s.bezierCurveTo(-0.9, 0.1, -0.5, 0.8, 0, 0.35); s.bezierCurveTo(0.5, 0.8, 0.9, 0.1, 0, -0.5); return new THREE.ShapeGeometry(s); })();
const heartMeshes = Array.from({ length: 30 }, () => { const m = new THREE.Mesh(heartGeo, new THREE.MeshBasicMaterial({ color: '#ff6fa8', transparent: true, depthWrite: false })); m.visible = false; m.scale.setScalar(0.28); scene.add(m); return m; });

// ---------- 毎コマ ----------
const clock = new THREE.Clock(); let T = 0, frames = 0, tf = performance.now();
function step(dt) {
  T += dt; timeU.value = T;
  for (const b of blobs) {
    // ばね：s＝たてに伸びる量。ぷるぷる（ばね定数・減衰）
    const k = 150, c = 6.5; b.v += (-k * (b.s - (b.held ? -0.3 : 0)) - c * b.v) * dt; b.s += b.v * dt;
    b.v += Math.sin(T * 2.2 + b.t0) * 0.04;   // いつもの、ゆらゆら
    const s = THREE.MathUtils.clamp(b.s, -0.45, 0.55);
    if (b.isTree) { b.body.scale.set(b.sx * (1 - s * 0.45), b.sy * (1 + s), b.sx * (1 - s * 0.45)); }
    else {
      // ぴょん：ときどき跳ぶ。着地でつぶれる
      b.nextHop -= dt; if (b.base > 0 && b.nextHop < 0 && b.hop <= 0.001) { b.hv = rr(2.2, 3.4); b.nextHop = rr(2.5, 6) / (b.base * 4); }
      b.hv -= 14 * dt; b.hop += b.hv * dt; if (b.hop < 0) { if (b.hv < -1) b.v -= Math.min(6, -b.hv * 1.3); b.hop = 0; b.hv = 0; }
      b.grp.position.y = b.hop; b.grp.rotation.z = b.tilt + Math.sin(T * 1.7 + b.t0) * 0.03;
      b.body.scale.set(b.r * (1 - s * 0.5), b.r * (1 + s), b.r * (1 - s * 0.5)); b.body.position.y = (b.r * (1 + s)) * 0.62 - 0.05;
      b.face.position.copy(b.body.position); b.face.scale.set(b.r * (1 - s * 0.5), b.r * (1 + s), b.r * (1 - s * 0.5));
      b.shadow.scale.setScalar(1 - Math.min(0.5, b.hop * 0.25)); b.shadow.material.opacity = 1 - Math.min(0.6, b.hop * 0.3);
    }
    const wob = THREE.MathUtils.clamp(Math.abs(b.v) * 0.07 + Math.abs(b.s) * 0.4, 0, 1); b.mat.userData.U.uWob.value = wob; if (b.cap) b.cap.material.userData.U.uWob.value = wob;
  }
  // 恋人は、ときどき、同時にぴょん
  star.rotation.y = T * 1.2; star.position.y = 4.15 + Math.sin(T * 2) * 0.05;
  for (const d of drops) { const u = ((T * 0.3 + d.ph) % 3) / 3, ext = Math.min(1, u * 2.2) * d.len, fall = Math.max(0, (u - 0.45) / 0.55); const y = d.y0 - ext - fall * fall * 3.2, vis = fall < 0.95; d.strand.visible = d.ball.visible = vis;
    d.strand.scale.set(1, Math.max(0.01, ext), 1); d.strand.position.set(d.x, d.y0 - ext / 2 - fall * fall * 3.2 * 0, d.z); d.ball.position.set(d.x, y - 0.05, d.z); d.ball.scale.set(1 - fall * 0.2, 1 + fall * 0.9, 1 - fall * 0.2); if (fall > 0) d.strand.visible = false; }
  const pa = sg.attributes.position; for (let i = 0; i < NS; i++) { let y = pa.getY(i) - sv[i][0] * dt; if (y < 0) y = 9; pa.setY(i, y); pa.setX(i, pa.getX(i) + Math.sin(T * 0.6 + sv[i][1]) * 0.003); } pa.needsUpdate = true;
  hearts.forEach((h) => { h.t += dt; }); for (let i = hearts.length - 1; i >= 0; i--) if (hearts[i].t > 1.4) hearts.splice(i, 1);
  heartMeshes.forEach((m, i) => { const h = hearts[i]; if (!h || h.t < 0) { m.visible = false; return; } m.visible = true; m.material.color.set(h.c); m.position.set(h.x, h.y + h.t * 1.6, h.z); m.material.opacity = 1 - h.t / 1.4; m.quaternion.copy(cam.quaternion); m.scale.setScalar(0.26 * (0.6 + Math.min(1, h.t * 4) * 0.6)); });
  yaw += (tYaw - yaw) * Math.min(1, dt * 6); pitch += (tPitch - pitch) * Math.min(1, dt * 6);
  if (!STILL && !holds.size && Math.abs(tYaw) < 0.001) { yaw = Math.sin(T * 0.25) * 0.08; }
  placeCam();
}
const fpsEl = q.has('fps') ? document.getElementById('fps') : null; if (fpsEl) fpsEl.hidden = false;
let fAcc = 0, fN = 0, fTot = 0;
function adapt(raw) {   // 30コマの平均が24ms（約40fps）より遅ければ、解像度を0.5ずつ、1まで下げる。タブを離れた時の長い空白（1秒超）は数えない
  if (STILL || raw > 1 || ++fTot < 20) return; fAcc += raw; if (++fN < 30) return;
  const ms = fAcc / fN * 1000; fAcc = 0; fN = 0; if (ms > 24 && DPR > 1) { DPR = Math.max(1, DPR - 0.5); renderer.setPixelRatio(DPR); size(); }
}
function frame() {
  const raw = clock.getDelta(); step(Math.min(0.05, raw)); syncMirror(); renderer.render(scene, cam); adapt(raw);
  frames++; if (performance.now() - tf > 1000) { if (fpsEl) fpsEl.textContent = frames + 'fps ×' + DPR; frames = 0; tf = performance.now(); }
  if (!STILL) requestAnimationFrame(frame);
}
if (STILL) { const t0 = +q.get('still') || 3; for (let i = 0; i < Math.round(t0 * 60); i++) step(1 / 60); if (q.has('poke')) { poke(loverA, 1); poke(loverB, 0.6); for (let i = 0; i < 9; i++) step(1 / 60); } syncMirror(); renderer.render(scene, cam); window.renderDone = true; }
else { frame(); setTimeout(() => { window.renderDone = true; }, 500); }
window.__ok = true; document.getElementById('load').remove();
